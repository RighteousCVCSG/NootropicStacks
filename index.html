    <!-- Static JSON-LD fallback for non-JS crawlers (GPTBot, ClaudeBot,
         PerplexityBot, Google-Extended without JS execution).
         The runtime React app ALSO injects schemas via JsonLd/Helmet, so
         JS-aware crawlers see fresher, route-specific data. The blocks
         below are the homepage-stable subset that doesn't need to mutate
         per route. -->

    <!-- Organization (kept inline so even with no JS, AI agents can
         resolve the publisher entity). -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "NootropicStacker",
      "url": "https://nootropicstacker.com/",
      "logo": "https://nootropicstacker.com/favicon.svg",
      "sameAs": [
        "https://twitter.com/nootropicstacker"
      ]
    }
    </script>

    <!-- MedicalWebPage with reviewedBy (E-E-A-T) and dateModified for the
         home / landing page. Provides citability scaffolding for AI
         answer engines on YMYL queries. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "MedicalWebPage",
      "name": "NootropicStacker — Free Nootropic Stack Builder",
      "url": "https://nootropicstacker.com/",
      "description": "Free tool to plan, score, and check supplement stacks. 195 compounds, 60+ pairwise interactions, every claim cited to PubMed.",
      "inLanguage": "en-US",
      "medicalAudience": { "@type": "MedicalAudience", "audienceType": "Patient" },
      "about": {
        "@type": "MedicalEntity",
        "name": "Nootropic supplementation"
      },
      "reviewedBy": {
        "@type": "Person",
        "name": "Vera Huang",
        "jobTitle": "CMO, NootropicStacker",
        "description": "Neuroscience researcher (UCSD) and editorial reviewer for NootropicStacker."
      },
      "mainEntityOfPage": "https://nootropicstacker.com/build"
    }
    </script>

    <!-- BreadcrumbList for the homepage. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": [{
        "@type": "ListItem",
        "position": 1,
        "name": "Home",
        "item": "https://nootropicstacker.com/"
      }]
    }
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "NootropicStacker",
      "applicationCategory": "HealthApplication",
      "applicationSubCategory": "Nootropic stack builder",
      "operatingSystem": "Web",
      "url": "https://nootropicstacker.com/build",
      "provider": {
        "@type": "Organization",
        "name": "NootropicStacker",

    }
    </script>
