[deploy]
startCommand = "node server.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[phases.setup]
aptPkgs = ["chromium"]
nixPkgs = ["nodejs_18"]
nixLibs = []

[phases.install]
cmds = ["npm install -g corepack@0.24.1 && corepack enable", "pnpm install --no-frozen-lockfile"]

[phases.build]
# build:full = build + prerender via headless Chromium so JSON-LD/OG/canonical
# ship in static HTML for non-JS-executing AI crawlers (GPTBot, ClaudeBot,
# PerplexityBot, Google-Extended). Chromium is provisioned by aptPkgs in
# [phases.setup]; the prerender script auto-detects /usr/bin/chromium and
# gracefully no-ops if puppeteer-core or Chrome aren't available.
#
# CHROME_PATH env var can be set in Railway dashboard to override path
# detection if Railway's chromium install lands at a non-standard location.
cmds = ["pnpm run build:full"]
