[phases.setup]
aptPkgs = ["chromium"]
nixPkgs = ["nodejs_18"]
nixLibs = []

[phases.install]
cmds = ["npm install -g corepack@0.24.1 && corepack enable", "pnpm install --no-frozen-lockfile"]

[phases.build]
# NOTE: Railway switched to Railpack (v0.23+) — this nixpacks.toml is
# kept for reference only and is no longer read by the build pipeline.
# Effective build config lives in railway.toml + package.json.
cmds = ["pnpm run build"]
